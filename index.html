<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04090f">
<title>RAM 1500</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Truck remote over Bluetooth: Chrome Web Bluetooth attaches to the phone's existing walk-up link, so the phone
   keeps mobile internet. Public page: no plate text, no secrets; only the paired phone can use the board.
   Look: tactical console in army blue. Rules that keep it from looking cheap: 1px strokes only, 8px chamfers,
   an 8px spacing grid, real units on every number, glow only on the radar and the vehicle hologram. */
:root{
  --bg:#04090f; --p0:#061019; --p1:#08151f; --edge:#173447; --edge2:#22506b; --tick:#2b6683;
  --cy:#43c8f5; --cy2:#8fe0ff; --tx:#d9f2fc; --mut:#7fa5b8; --faint:#4b6e80;
  --ok:#3fe0a0; --amb:#ffb447; --red:#ff5d5d;
  --hud:"Rajdhani","Bahnschrift","Segoe UI",system-ui,sans-serif; --mono:"Share Tech Mono","Roboto Mono",Consolas,monospace;
  color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:var(--bg)}
body{color:var(--tx);font:500 14px/1.3 var(--hud);-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums;
  background:radial-gradient(120% 70% at 50% 0,#0a2233 0,transparent 60%),
   linear-gradient(rgba(67,200,245,.035) 1px,transparent 1px) 0 0/16px 16px,
   linear-gradient(90deg,rgba(67,200,245,.035) 1px,transparent 1px) 0 0/16px 16px,var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:1px solid var(--cy2);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:100vh;min-height:100dvh;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.lb{font:12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.mono{font-family:var(--mono)}

/* Chamfered frame: 1px edge drawn as a background layer under a clipped fill. */
.fr{--c:8px;--e:var(--edge);--f:linear-gradient(180deg,var(--p1),var(--p0));position:relative;isolation:isolate;background:var(--e);
  clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c))}
.fr:before{content:"";position:absolute;inset:1px;z-index:-1;background:var(--f);clip-path:inherit}
/* Corner brackets on key panels. */
.br:after{content:"";position:absolute;inset:3px;pointer-events:none;
  background:linear-gradient(var(--cy),var(--cy)) right top/9px 1px,linear-gradient(var(--cy),var(--cy)) right top/1px 9px,
  linear-gradient(var(--cy),var(--cy)) left bottom/9px 1px,linear-gradient(var(--cy),var(--cy)) left bottom/1px 9px;background-repeat:no-repeat;opacity:.8}

/* Header */
.top{display:flex;align-items:center;gap:10px;padding:2px 2px 8px;border-bottom:1px solid var(--edge);position:relative}
.top:after{content:"";position:absolute;left:0;bottom:-1px;width:64px;height:1px;background:var(--cy)}
.top img{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 0 4px rgba(67,200,245,.35))}
.top h1{font:700 21px/1 var(--hud);letter-spacing:.18em}
.top .lb{margin-top:3px;font-size:11px}
.link{margin-left:auto;display:grid;justify-items:end;gap:3px}
.link .st{display:flex;align-items:center;gap:6px;font:600 13px/1 var(--hud);letter-spacing:.16em;color:var(--mut)}
.link .st i{width:7px;height:7px;background:var(--faint)}
.link.ok .st{color:var(--ok)}.link.ok .st i{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.link.wait .st{color:var(--amb)}.link.wait .st i{background:var(--amb)}
.link.err .st{color:var(--red)}.link.err .st i{background:var(--red)}
.link .lb{font-size:10px}

/* Tactical display: radar + vehicle */
.tac{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(0,1fr);gap:8px}
.radar{padding:6px}
.radar svg{display:block;width:100%;height:auto}
.radar text{font:7px var(--mono);fill:var(--faint);letter-spacing:.02em}
.sweep{transform-origin:100px 100px;animation:sw 4s linear infinite}
@keyframes sw{to{transform:rotate(360deg)}}
.ping{transform-origin:center;transform-box:fill-box;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.side{display:grid;grid-template-rows:auto 1fr;gap:8px;min-width:0}
.unit{--f:#02070c;padding:6px 6px 5px;display:grid;gap:4px;overflow:hidden}
.unit .img{position:relative;height:92px;display:grid;place-items:center;
  background:linear-gradient(rgba(67,200,245,.07) 1px,transparent 1px) 0 0/10px 10px,linear-gradient(90deg,rgba(67,200,245,.07) 1px,transparent 1px) 0 0/10px 10px}
.unit img{max-height:88px;max-width:100%;object-fit:contain;filter:drop-shadow(0 0 5px rgba(67,200,245,.45));animation:fl 7s infinite}
@keyframes fl{0%,95%,100%{opacity:1}96%{opacity:.75}97%{opacity:1}98%{opacity:.85}}
.unit .row{display:flex;justify-content:space-between;gap:6px;padding:0 4px 0 8px}
.unit .row b{font:600 13px/1 var(--hud);letter-spacing:.12em}
.read{padding:8px 9px;display:grid;gap:6px;align-content:center}
.rd{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.rd b{font:16px/1 var(--mono);letter-spacing:.02em;white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;height:6px}
.seg i{background:#0f2a3a}.seg i.on{background:var(--cy)}.seg i.on.hi{background:var(--ok)}

/* Telemetry strip */
.tel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{--c:6px;padding:7px 9px;display:grid;gap:4px;min-width:0}
.cell b{font:700 17px/1 var(--hud);letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell b.amb{color:var(--amb)}

/* Power strip: the EcoFlow Delta 2, read by the board every 5 min while the phone is linked */
.pwr{display:grid;grid-template-columns:1fr;gap:8px}
.pwr[hidden]{display:none}
.pwr .cell{grid-template-columns:auto 1fr;align-items:end;column-gap:8px}
.pwr .cell .lb{grid-column:1/-1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwr .cell b{font-size:20px}
.pwr .cell b.lo{color:var(--red)}.pwr .cell b.mid{color:var(--amb)}.pwr .cell b.old{color:var(--faint)}
.pwr{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.pwr .cell small{font:12px/1.15 var(--mono);color:var(--mut);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}

/* Section rule with ticks */
.rule{display:flex;align-items:center;gap:8px;height:16px}
.rule .ln{flex:1;height:5px;background:linear-gradient(90deg,var(--edge2) 1px,transparent 1px) 0 0/8px 5px;border-bottom:1px solid var(--edge2)}
.rule .msg{font:12px/1 var(--mono);letter-spacing:.08em;color:var(--cy)}
.rule .msg.bad{color:var(--red)}

/* Command buttons */
.cmd{--e:var(--edge2);--f:linear-gradient(180deg,#0b2131,#071420);display:grid;place-content:center;justify-items:center;gap:5px;width:100%;transition:filter .12s,transform .08s}
.cmd:active{transform:scale(.985);filter:brightness(1.35)}
.cmd b{font:700 22px/1 var(--hud);letter-spacing:.32em;text-indent:.32em}
.cmd .lb{font-size:10px;letter-spacing:.14em}
.big{--c:12px;--e:var(--cy);--f:linear-gradient(180deg,#0f3550,#081d2d);min-height:82px;flex:1.3 1 82px;max-height:150px}
.big b{font-size:32px;letter-spacing:.4em;text-indent:.4em;text-shadow:0 0 10px rgba(67,200,245,.45)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1 1 68px;max-height:120px}
.pair .cmd{min-height:68px;height:100%}
.cmd.cur{--e:var(--ok)}.cmd.cur .lb{color:var(--ok)}
/* Remote start: press and hold; the 12 segments fill in 1.2 s. */
.start{--e:rgba(255,180,71,.75);position:relative}
.start b{color:var(--amb)}
.start .hold{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;width:120px;height:4px}
.start .hold i{background:rgba(255,180,71,.18)}
.start.holding .hold i{animation:fillseg 1.2s steps(1,end) forwards}
@keyframes fillseg{to{background:var(--amb)}}
.start.running{--f:linear-gradient(180deg,#3a2608,#1c1205)}

/* Walk-up console switches with indicator lamps */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw{--c:6px;--e:var(--edge);display:grid;justify-items:center;gap:5px;padding:9px 4px 8px;width:100%}
.sw .lamp{width:22px;height:4px;background:#13293a}
.sw b{font:700 16px/1 var(--hud);letter-spacing:.2em;text-indent:.2em}
.sw .lb{font-size:9px;letter-spacing:.1em}
.sw.on{--e:var(--edge2)}
.sw.on .lamp{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.sw.arm.on .lamp{background:var(--amb);box-shadow:0 0 6px var(--amb)}
.sw.on b{color:#fff}

/* Event log: newest line; tap for more */
.log{--c:6px;padding:7px 10px;display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left}
.log ul{flex:1;min-width:0;list-style:none;padding:0;font:12px/17px var(--mono);color:var(--mut);display:grid}
.log li{display:flex;gap:10px;white-space:nowrap;overflow:hidden}
.log li time{flex:none;width:48px;color:var(--faint)}
.log li span{overflow:hidden;text-overflow:ellipsis}
.log li:nth-child(n+2){display:none}.log.open li{display:flex}
.log .lb{padding-top:3px}

/* Setup sheet */
.sheet{position:fixed;inset:0;background:rgba(2,6,10,.78);display:grid;align-items:center;padding:20px;z-index:5}
.sheet[hidden]{display:none}
.sheet .fr{--c:12px;--e:var(--cy);padding:18px;display:grid;gap:12px;max-width:420px;width:100%;margin:0 auto}
.sheet b{font:700 18px/1.1 var(--hud);letter-spacing:.14em}
.sheet p{font:14px/1.45 system-ui,sans-serif;color:var(--mut)}.sheet p em{color:var(--tx);font-style:normal}
.sheet button{min-height:52px}
@media (prefers-reduced-motion:reduce){.sweep,.ping,.unit img{animation:none}.start.holding .hold i{animation-duration:0s}}
@media (max-height:690px){.unit .img{height:70px}.unit img{max-height:66px}.big{min-height:70px}.pair .cmd{min-height:58px}}
</style></head><body>
<main class="app">
<header class="top">
  <img src="logo.webp" alt="Ram">
  <div><h1>RAM 1500</h1><div class="lb">Warlock // 5.7L Hemi // 4x4</div></div>
  <button class="link" id="link" type="button"><span class="st"><i></i><span id="linkT">INIT</span></span><span class="lb" id="linkS">BLE // ---</span></button>
</header>

<section class="tac">
  <div class="fr radar br" aria-label="Phone distance radar">
    <svg viewBox="0 0 200 200" id="rad">
      <defs>
        <radialGradient id="scr" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#0b2738"/><stop offset="1" stop-color="#03090f"/></radialGradient>
        <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#43c8f5" stop-opacity="0"/><stop offset="1" stop-color="#43c8f5" stop-opacity=".32"/></linearGradient>
      </defs>
      <circle cx="100" cy="100" r="80" fill="url(#scr)"/>
      <g id="ticks" stroke="#2b6683"></g>
      <g id="nums"></g>
      <circle cx="100" cy="100" r="80" fill="none" stroke="#22506b"/>
      <g fill="none" stroke-width=".8">
        <circle cx="100" cy="100" r="22" stroke="#173447"/>
        <circle id="zU" cx="100" cy="100" r="43" stroke="#3fe0a0" stroke-dasharray="3 3" opacity=".75"/>
        <circle id="zS" cx="100" cy="100" r="58.4" stroke="#ffb447" stroke-dasharray="2 4" opacity=".55"/>
        <path d="M100 20V180M20 100H180" stroke="#173447"/>
        <path d="M43.4 43.4L156.6 156.6M156.6 43.4L43.4 156.6" stroke="#10283a" stroke-dasharray="1 3"/>
      </g>
      <text x="103" y="55">-65 UNLK</text><text x="103" y="40">-76 START</text>
      <g class="sweep"><path d="M100 100L100 20A80 80 0 0 1 156.6 43.4Z" fill="url(#sw)"/><path d="M100 100L156.6 43.4" stroke="#8fe0ff" stroke-width=".8"/></g>
      <path d="M96 104l4-9 4 9-4-2z" fill="none" stroke="#8fe0ff" stroke-width=".9"/>
      <g id="blip" style="display:none">
        <circle class="ping" r="4" fill="none" stroke="#3fe0a0" stroke-width=".8"/>
        <circle r="3" fill="#3fe0a0"/>
        <text id="blipT" x="6" y="-5" style="fill:#3fe0a0">PH</text>
      </g>
    </svg>
  </div>
  <div class="side">
    <div class="fr unit br">
      <div class="img"><img src="ram.webp" alt="Ram 1500 hologram"></div>
      <div class="row"><span class="lb">Unit</span><b id="unitS">--</b></div>
    </div>
    <div class="fr read">
      <div class="rd"><span class="lb">Sig</span><b id="dbm">-- dBm</b></div>
      <div class="seg" id="seg"></div>
      <div class="rd"><span class="lb">Zone</span><b id="zone" class="mono">--</b></div>
    </div>
  </div>
</section>

<section class="tel">
  <div class="fr cell"><span class="lb">Mode</span><b id="md">--</b></div>
  <div class="fr cell"><span class="lb">Engine</span><b id="en">--</b></div>
  <div class="fr cell"><span class="lb">Last cmd</span><b id="ls">--</b></div>
</section>
<section class="pwr" id="pwr" hidden>
  <div class="fr cell"><span class="lb" id="pAl">Delta 2</span><b id="pA">--</b><small id="pAs">--</small></div>
</section>

<div class="rule"><span class="lb">Command</span><span class="ln"></span><span class="msg" id="msg">&gt; STANDBY</span></div>
<button class="fr cmd big br" id="bUnlock" data-cmd="Unlock" type="button"><b>UNLOCK</b><span class="lb">Doors // CMD-02</span></button>
<div class="pair">
  <button class="fr cmd" id="bLock" data-cmd="Lock" type="button"><b>LOCK</b><span class="lb">Doors // CMD-01</span></button>
  <button class="fr cmd start" id="bStart" type="button"><b>START</b><span class="hold" id="holdBar"></span><span class="lb" id="startHint">Hold to start // CMD-03</span></button>
</div>

<div class="rule"><span class="lb">Walk-up</span><span class="ln"></span><span class="lb">Unlk zone -65</span></div>
<div class="modes">
  <button class="fr sw arm" id="mArm" type="button"><span class="lamp"></span><b>ARM</b><span class="lb">Start on approach</span></button>
  <button class="fr sw" id="mAuto" data-cmd="Auto" type="button"><span class="lamp"></span><b>AUTO</b><span class="lb">Walk-up unlock</span></button>
  <button class="fr sw" id="mOff" data-cmd="Off" type="button"><span class="lamp"></span><b>OFF</b><span class="lb">Buttons only</span></button>
</div>

<button class="fr log" id="logBox" type="button"><span class="lb">Log</span><ul id="events"><li><time>--</time><span>No events yet</span></li></ul><span class="lb">+</span></button>
</main>

<div class="sheet" id="sheet" hidden><div class="fr br">
  <b>LINK TO TRUCK</b>
  <p id="sheetMsg">Chrome needs permission to talk to the board.</p>
  <button class="fr cmd" type="button" id="sheetBtn"><b style="font-size:17px">PAIR CHROME</b><span class="lb">Choose Ram Remote</span></button>
</div></div>

<script>
'use strict';
const NAME = 'Ram Remote';
const SVC = '8f1c0001-6a52-4d2e-9a4b-52414d313530';
const CMD = '8f1c0002-6a52-4d2e-9a4b-52414d313530';
const STAT = '8f1c0003-6a52-4d2e-9a4b-52414d313530';
const $ = id => document.getElementById(id), enc = new TextEncoder(), dec = new TextDecoder();
let dev = null, cmdCh = null, statCh = null, connected = false, busy = false, pollT = null, retryT = null, cur = null;

/* Radar bezel: a tick every 10 degrees, long ticks and bearing numbers every 30. */
(function bezel() {
  const t = $('ticks'), n = $('nums'), NS = 'http://www.w3.org/2000/svg';
  for (let a = 0; a < 360; a += 5) {
    const r = a * Math.PI / 180, long = a % 30 === 0, mid = a % 10 === 0;
    const r1 = 80, r2 = long ? 87 : mid ? 84 : 82.5;
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', 100 + Math.sin(r) * r1); l.setAttribute('y1', 100 - Math.cos(r) * r1);
    l.setAttribute('x2', 100 + Math.sin(r) * r2); l.setAttribute('y2', 100 - Math.cos(r) * r2);
    l.setAttribute('stroke-width', long ? '1' : '.6'); if (!mid) l.setAttribute('opacity', '.5');
    t.append(l);
  }
  /* Bearing numbers outside the ring every 30 degrees (0, 3, 6 ... 33), like a console scope. */
  for (let a = 0; a < 360; a += 30) {
    const r = a * Math.PI / 180, e = document.createElementNS(NS, 'text');
    e.textContent = String(a / 10);
    e.setAttribute('x', (100 + Math.sin(r) * 93).toFixed(1)); e.setAttribute('y', (102.5 - Math.cos(r) * 93).toFixed(1));
    e.setAttribute('text-anchor', 'middle'); n.append(e);
  }
})();
$('seg').innerHTML = '<i></i>'.repeat(12);
$('holdBar').innerHTML = Array.from({ length: 12 }, (_, i) => `<i style="animation-delay:${(i * 0.1).toFixed(1)}s"></i>`).join('');

/* Web Bluetooth runs one GATT operation at a time: every operation goes through this queue. */
let chain = Promise.resolve();
function op(fn) { const p = chain.then(fn, fn); chain = p.catch(() => {}); return p; }

function say(t, bad) { const m = $('msg'); m.textContent = '> ' + t.toUpperCase(); m.className = 'msg' + (bad ? ' bad' : ''); }
function link(t, s, cls) { $('linkT').textContent = t; $('linkS').textContent = s; $('link').className = 'link ' + (cls || ''); }
function enable(on) { document.querySelectorAll('[data-cmd],#bStart,#mArm').forEach(b => { b.disabled = !on; }); }
function sheet(msg) { $('sheetMsg').innerHTML = msg; $('sheet').hidden = false; }
function timeout(p, ms, w) { return Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error(w + ' timed out')), ms))]); }
/* dBm to radar radius: -40 dBm at the centre, -90 dBm at the rim. Zone rings use the same scale (-65 = 43, -76 = 58.4). */
const rad = d => Math.max(6, Math.min(78, 8 + (-d - 40) * 1.4));
/* Board ages look like " 4m07s" or " 2h15m"; shown as "4m", "2h", "21s". */
function ago(a) {
  const h = /(\d+)h/.exec(a), m = /(\d+)m(?!s)/.exec(a), s = /(\d+)s/.exec(a);
  if (h) return h[1] + 'h';
  if (m && +m[1] > 0) return m[1] + 'm';
  return (s ? +s[1] : 0) + 's';
}

function show(s) {
  cur = s;
  const d = s.link ? (s.avg || 0) : 0, last = (s.last || '').toLowerCase();
  $('dbm').textContent = d ? d + ' dBm' : '-- dBm';
  const lvl = d ? Math.max(1, Math.min(12, Math.round((d + 90) / 3.3))) : 0;
  $('seg').querySelectorAll('i').forEach((b, i) => { b.className = i < lvl ? (d >= -65 ? 'on hi' : 'on') : ''; });
  $('zone').textContent = !s.link ? 'AWAY' : d >= -65 ? 'UNLOCK' : d >= -76 ? 'START' : 'FAR';
  const b = $('blip');
  if (d) {
    const r = rad(d), a = 38 * Math.PI / 180;
    b.setAttribute('transform', `translate(${(100 + Math.sin(a) * r).toFixed(1)} ${(100 - Math.cos(a) * r).toFixed(1)})`);
    $('blipT').textContent = 'PH ' + d; b.style.display = '';
  } else b.style.display = 'none';
  /* Lock state comes from the last command: the truck sends no feedback. */
  $('unitS').textContent = s.engine ? 'RUNNING' : last === 'lock' ? 'LOCKED' : last === 'unlock' ? 'UNLOCKED' : 'READY';
  $('md').textContent = (s.auto ? 'AUTO' : 'OFF') + (s.armed ? '+ARM' : '');
  $('en').textContent = s.engine ? 'RUN' : 'OFF'; $('en').className = s.engine ? 'amb' : '';
  $('ls').textContent = s.last && s.last !== 'none since restart' ? s.last.toUpperCase() : 'NONE';
  $('bLock').classList.toggle('cur', last === 'lock'); $('bUnlock').classList.toggle('cur', last === 'unlock');
  $('bStart').classList.toggle('running', !!s.engine);
  $('mArm').classList.toggle('on', !!s.armed); $('mAuto').classList.toggle('on', !!s.auto); $('mOff').classList.toggle('on', !s.auto);
  const ul = $('events'); ul.textContent = '';
  (s.ev || []).forEach(e => {
    const li = document.createElement('li'), t = document.createElement('time'), x = document.createElement('span');
    t.textContent = ago(e[0]); x.textContent = e[1].toUpperCase(); li.append(t, x); ul.append(li);
  });
  if (!ul.children.length) ul.innerHTML = '<li><time>--</time><span>NO EVENTS YET</span></li>';
}

async function exchange(n) {
  await cmdCh.writeValueWithResponse(enc.encode(n));
  return JSON.parse(dec.decode(await statCh.readValue()));
}
/* EcoFlow Delta 2 readings ("Power"). A board without the reader refuses the command: the strip stays hidden. */
let pwrN = 0;
const secs = a => a < 90 ? a + 's' : a < 5400 ? Math.round(a / 60) + 'm' : Math.round(a / 3600) + 'h';
const mins = m => m < 60 ? m + 'm' : (m < 600 ? (m / 60).toFixed(1).replace('.0', '') : Math.round(m / 60)) + 'h';
let pwrHold = '';
/* Why the board is not reading, when that is the user's doing or needs the user. */
function holdText(p) {
  if (p.hold === 'pause') return 'PAUSED ' + secs(p.pause || 0);
  if (p.hold === 'off') return 'READER OFF';
  if (p.hold === 'guard') return 'READER STOPPED';
  if (!p.id) return 'NEEDS USER ID';
  return '';
}
function showPower(p) {
  const list = (p && p.ef) || [], h = holdText(p);
  pwrHold = p.hold || '';
  $('pwr').hidden = false;
  ['A'].forEach(u => {
    const e = list.find(x => x.u === u), b = $('p' + u), s = $('p' + u + 's');
    $('p' + u + 'l').textContent = 'Delta 2' + (e && e.age >= 0 ? ' · read ' + secs(e.age) + ' ago' : '');
    if (!e || e.age < 0) {
      b.textContent = '--'; b.className = '';
      s.textContent = h || (e ? (e.st === 'ok' ? 'WAITING' : e.st.toUpperCase())
        : list.length ? 'NOT SEEN' : p.busy ? 'READING' : p.hold ? 'WAITING' : 'SCAN IN ' + secs(p.next || 0));
      return;
    }
    if (h) { b.textContent = e.soc + '%'; b.className = 'old'; s.textContent = h; return; }
    b.textContent = e.soc + '%'; b.className = e.age > 900 ? 'old' : e.soc < 20 ? 'lo' : e.soc < 40 ? 'mid' : '';
    let t = e.in > e.out + 5 ? 'Charging ' + e.in + ' W' + (e.chg > 0 ? ' · full in ' + mins(e.chg) : '')
      : e.out > e.in + 5 ? 'Using ' + e.out + ' W' + (e.dsg > 0 ? ' · ' + mins(e.dsg) + ' left' : '')
      : 'In ' + e.in + ' W · out ' + e.out + ' W';
    if (e.st !== 'ok') t = e.st.toUpperCase() + ' · ' + t;   /* last read failed: older value shown */
    s.textContent = t;
  });
}
function poll() {
  stopPoll();
  pwrN = 0;
  pollT = setInterval(() => {
    if (!connected || busy || document.hidden) return;
    op(() => exchange('Status')).then(show).catch(() => {});
    if (pwrN++ % 8 === 0) op(() => exchange('Power')).then(showPower).catch(() => { $('pwr').hidden = true; });
  }, 2000);
}
function stopPoll() { if (pollT) clearInterval(pollT); pollT = null; }

/* Chrome opens GATT only to a device it has heard in this page session. */
async function hear(d, ms) {
  if (!d.watchAdvertisements) return;
  const ac = new AbortController();
  const h = new Promise(r => d.addEventListener('advertisementreceived', r, { once: true }));
  await d.watchAdvertisements({ signal: ac.signal });
  try { await timeout(h, ms, 'Listening'); } finally { ac.abort(); }
}

async function connect() {
  clearTimeout(retryT);
  if (connected || busy) return;
  if (!navigator.bluetooth) { link('NO BT', 'BLE // NONE', 'err'); sheet('This browser has no Web Bluetooth. Open this page in <em>Chrome</em>.'); return; }
  if (!navigator.bluetooth.getDevices) { link('SETUP', 'BLE // FLAG', 'wait'); sheet('Turn on <em>chrome://flags/#enable-web-bluetooth-new-permissions-backend</em>, relaunch Chrome, then reload.'); return; }
  busy = true; enable(false);
  try {
    dev = (await navigator.bluetooth.getDevices()).find(d => d.name === NAME);
    if (!dev) { link('SETUP', 'BLE // UNPAIRED', 'wait'); sheet('Tap the button, then choose <em>Ram Remote</em> in the list.'); return; }
    link('SCAN', 'BLE // LISTENING', 'wait'); say('Listening for the truck');
    await hear(dev, 12000);
    link('SYNC', 'BLE // CONNECTING', 'wait');
    const server = await timeout(dev.gatt.connect(), 15000, 'Connect');
    let svc;
    try { svc = await server.getPrimaryService(SVC); }
    catch (e) {
      if (e.name === 'SecurityError') { link('SETUP', 'BLE // PERMISSION', 'wait'); sheet('Chrome needs permission for the truck controls. Tap the button and choose <em>Ram Remote</em>.'); return; }
      if (e.name === 'NotFoundError') { link('UPDATE', 'BLE // OLD CACHE', 'err'); sheet('The phone still has an old copy of the board\'s services. Turn the phone\'s <em>Bluetooth off and on</em>, wait 10 seconds, then reload.'); return; }
      throw e;
    }
    cmdCh = await svc.getCharacteristic(CMD);
    statCh = await svc.getCharacteristic(STAT);
    dev.addEventListener('gattserverdisconnected', drop, { once: true });
    connected = true; $('sheet').hidden = true; link('LINK OK', 'BLE // ENCRYPTED', 'ok'); enable(true); say('Ready');
    show(await op(() => exchange('Status')));
    poll();
  } catch (e) {
    link('NO LINK', 'BLE // OUT OF RANGE', 'err');
    say(e.message.includes('Listening') ? 'Truck not in range' : e.message, true);
    retry();
  } finally { busy = false; }
}
function drop() { connected = false; stopPoll(); enable(false); link('LOST', 'BLE // RECONNECTING', 'wait'); say('Link lost, reconnecting', true); retry(1500); }
function retry(ms) { clearTimeout(retryT); if (!document.hidden) retryT = setTimeout(connect, ms || 5000); }

const DONE = { Lock: 'Lock sent', Unlock: 'Unlock sent', Start: 'Start sent', Auto: 'Walk-up auto', Off: 'Walk-up off', Arm: 'Start on approach armed', Disarm: 'Start on approach off' };
async function go(n) {
  if (!connected) { say('Not connected', true); return; }
  say(n + ' ...');
  try { show(await op(() => exchange(n))); say(DONE[n] || n); if (navigator.vibrate) navigator.vibrate(30); }
  catch (e) { say(n + ' failed', true); }
}
document.querySelectorAll('[data-cmd]').forEach(b => b.addEventListener('click', () => go(b.dataset.cmd)));
$('mArm').addEventListener('click', () => go(cur && cur.armed ? 'Disarm' : 'Arm'));

/* Remote start: press and hold 1.2 s, so a stray tap never starts the engine. */
let holdT = null;
const st = $('bStart');
function holdStart(e) {
  if (st.disabled) return;
  e.preventDefault();
  st.classList.add('holding'); $('startHint').textContent = 'Keep holding';
  holdT = setTimeout(() => { holdT = null; holdReset(); go('Start'); }, 1200);
}
function holdReset() { st.classList.remove('holding'); $('startHint').textContent = 'Hold to start // CMD-03'; }
function holdCancel() { if (holdT) { clearTimeout(holdT); holdT = null; say('Hold to start'); } holdReset(); }
st.addEventListener('pointerdown', holdStart);
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => st.addEventListener(t, () => { if (st.classList.contains('holding')) holdCancel(); }));
st.addEventListener('contextmenu', e => e.preventDefault());

$('logBox').addEventListener('click', () => $('logBox').classList.toggle('open'));
/* Power strip: tap = pause the Delta reader 15 min (frees the Deltas for the EcoFlow app), tap again to resume;
   hold 2 s = reader off / on (kept across restarts). */
(function () {
  const pw = $('pwr'); let t = null, long = false;
  const send = n => { if (connected) op(() => exchange(n)).then(p => { showPower(p); say(n === 'EfPause' ? (p.hold === 'pause' ? 'Delta reader paused 15 min' : 'Delta reader resumed') : p.hold === 'off' ? 'Delta reader off' : 'Delta reader on'); }).catch(e => say(e.message, true)); };
  pw.addEventListener('pointerdown', () => { long = false; t = setTimeout(() => { long = true; t = null; send(pwrHold === 'off' ? 'EfOn' : 'EfOff'); }, 2000); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(n => pw.addEventListener(n, () => { if (t) { clearTimeout(t); t = null; } }));
  pw.addEventListener('click', () => { if (!long) send('EfPause'); long = false; });
  pw.addEventListener('contextmenu', e => e.preventDefault());
})();
$('sheetBtn').addEventListener('click', async () => {
  try { await navigator.bluetooth.requestDevice({ filters: [{ name: NAME }], optionalServices: [SVC] }); $('sheet').hidden = true; connect(); }
  catch (e) { if (e.name !== 'NotFoundError') say(e.message, true); }
});
$('link').addEventListener('click', () => { if (!connected) connect(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopPoll(); clearTimeout(retryT); }
  else if (connected) poll(); else connect();
});
enable(false);
connect();
/* Offline copy of the page (sw.js), so the icon opens even with no signal. */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body></html>
