<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0d0f">
<title>RAM 1500</title>
<style>
/* Truck remote over Bluetooth. Chrome Web Bluetooth attaches to the phone's existing walk-up link, so the
   phone keeps mobile internet. Public page: no plate, no secrets; only the paired phone can use the board.
   Look: a quiet vehicle-maker app. Graphite surfaces, system type, colour only for state
   (green = linked/locked, amber = engine/start, red = fault). One screen, no scroll on a phone. */
:root{
  --bg:#0c0d0f; --s1:#15171a; --s2:#1c1f23; --line:#26292e; --line2:#33373d;
  --tx:#f2f3f5; --mut:#a0a6ad; --faint:#6c727a;
  --ok:#3fbf7f; --amb:#f0a63a; --bad:#ef6060;
  --r:16px; color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg)}
body{color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:2px solid var(--mut);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:10px;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}

/* Header */
.top{display:flex;align-items:center;gap:12px}
.top img{width:30px;height:30px;object-fit:contain;filter:grayscale(1) brightness(1.9) contrast(1.1)}
.top .name{font-weight:600;font-size:18px;letter-spacing:.01em}
.top .sub{color:var(--mut);font-size:13px}
.conn{margin-left:auto;display:flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--line2);border-radius:999px;font-size:13px;color:var(--mut);white-space:nowrap}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.conn.ok{color:var(--tx)}.conn.ok i{background:var(--ok)}
.conn.wait i{background:var(--amb)}.conn.err i{background:var(--bad)}

/* Vehicle */
.hero{position:relative;display:grid;justify-items:center;gap:6px;padding-top:2px}
.hero img{height:clamp(96px,16vh,136px);max-width:100%;object-fit:contain;mix-blend-mode:screen;
  filter:grayscale(1) brightness(1.15) contrast(1.25)}
.hero:before{content:"";position:absolute;left:18%;right:18%;top:68%;height:28%;background:radial-gradient(closest-side,rgba(255,255,255,.07),transparent);z-index:-1}
.state{text-align:center}
.state b{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em}
.state span{color:var(--mut);font-size:13px}

/* Readouts */
.stats{display:grid;grid-template-columns:1.25fr 1fr 1fr;background:var(--s1);border:1px solid var(--line);border-radius:var(--r)}
.stat{padding:11px 12px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat .k{color:var(--faint);font-size:12px}
.stat .v{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sig{display:flex;align-items:end;gap:8px}
.bars{display:flex;align-items:end;gap:2px;height:16px;flex:none}
.bars i{width:4px;border-radius:1px;background:var(--line2)}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:11px}.bars i:nth-child(4){height:14px}.bars i:nth-child(5){height:16px}
.bars i.on{background:var(--tx)}
.stat .v.run{color:var(--amb)}

/* Lock / unlock */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctl{display:grid;justify-items:center;align-content:center;gap:7px;min-height:90px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);transition:background .15s,transform .08s}
.ctl:active{transform:scale(.98);background:var(--s2)}
.ctl svg{width:30px;height:30px;stroke:var(--tx);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ctl span{font-weight:600}
.ctl.cur{border-color:var(--line2);background:var(--s2)}
.ctl.cur svg{stroke:var(--ok)}

/* Remote start: press and hold */
.start{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:0 18px;min-height:58px;border:1px solid var(--line);border-radius:var(--r);background:var(--s1);text-align:left}
.start .fill{position:absolute;inset:0;background:rgba(240,166,58,.18);transform-origin:left;transform:scaleX(0)}
.start.hold .fill{transform:scaleX(1);transition:transform 1.2s linear}
.start svg{position:relative;width:26px;height:26px;stroke:var(--amb);fill:none;stroke-width:1.8;stroke-linecap:round}
.start div{position:relative}
.start b{display:block;font-weight:600}
.start small{color:var(--mut);font-size:13px}
.start.running{border-color:rgba(240,166,58,.45)}

/* Walk-up */
.walk{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;display:grid;gap:10px}
.head{display:flex;align-items:baseline;justify-content:space-between}
.head b{font-weight:600}
.head span{color:var(--faint);font-size:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:9px 0;border-radius:9px;color:var(--mut);font-weight:500}
.seg button.sel{background:var(--s2);color:var(--tx);box-shadow:0 0 0 1px var(--line2)}
.armrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.armrow div{flex:1}
.armrow small{display:block;color:var(--mut);font-size:13px}
.sw{flex:none;width:46px;height:28px;border-radius:999px;background:var(--line2);position:relative;transition:background .15s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#d9dce0;transition:transform .15s}
.armrow[aria-checked="true"] .sw{background:var(--amb)}
.armrow[aria-checked="true"] .sw:after{transform:translateX(18px);background:#fff}

/* Activity */
.act{display:grid;gap:6px;padding:0 2px}
.act ul{list-style:none;padding:0;display:grid;gap:5px}
.act li{display:flex;gap:10px;font-size:13px;color:var(--mut)}
.act li time{flex:none;width:52px;color:var(--faint);white-space:nowrap}
.act li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act.open li span{white-space:normal}
.act li:nth-child(n+3){display:none}.act.open li:nth-child(n+3){display:flex}
.act .head button{color:var(--mut);font-size:13px}

/* Messages and setup */
.note{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translate(-50%,8px);opacity:0;transition:opacity .2s,transform .2s;
  background:var(--s2);border:1px solid var(--line2);border-radius:12px;padding:10px 14px;font-size:14px;pointer-events:none;max-width:calc(100% - 32px)}
.note.show{opacity:1;transform:translate(-50%,0)}.note.bad{border-color:rgba(239,96,96,.5)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;align-items:end;z-index:5}
.sheet[hidden]{display:none}
.sheet div{background:var(--s1);border-top:1px solid var(--line2);border-radius:20px 20px 0 0;padding:22px max(20px,env(safe-area-inset-left)) max(22px,env(safe-area-inset-bottom));display:grid;gap:12px;max-width:480px;width:100%;margin:0 auto}
.sheet b{font-size:18px;font-weight:600}
.sheet p{color:var(--mut);font-size:14px}.sheet p em{color:var(--tx);font-style:normal}
.sheet button{background:var(--tx);color:var(--bg);font-weight:600;border-radius:12px;padding:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-height:700px){.hero img{height:84px}.ctl{min-height:80px}.state b{font-size:19px}}
</style></head><body>
<main class="app">
<header class="top">
  <img src="logo.webp" alt="Ram">
  <div><div class="name">RAM 1500</div><div class="sub">Warlock · 5.7L · 4x4</div></div>
  <button class="conn" id="conn" type="button"><i></i><span id="connT">Starting</span></button>
</header>

<section class="hero">
  <img src="ram.webp" alt="Ram 1500">
  <div class="state"><b id="stateT">—</b><span id="stateS">Waiting for the board</span></div>
</section>

<section class="stats" aria-label="Status">
  <div class="stat"><div class="k">Phone signal</div>
    <div class="sig"><div class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></div><div class="v" id="dbm">—</div></div></div>
  <div class="stat"><div class="k">Distance</div><div class="v" id="zone">—</div></div>
  <div class="stat"><div class="k">Engine</div><div class="v" id="eng">—</div></div>
</section>

<section class="pair">
  <button class="ctl" id="bLock" data-cmd="Lock" type="button">
    <svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><path d="M12 14.6v2"/></svg>
    <span>Lock</span></button>
  <button class="ctl" id="bUnlock" data-cmd="Unlock" type="button">
    <svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.2"/><path d="M8 10.5V8a4 4 0 0 1 7.6-1.8"/><path d="M12 14.6v2"/></svg>
    <span>Unlock</span></button>
</section>

<button class="start" id="bStart" type="button">
  <span class="fill"></span>
  <svg viewBox="0 0 24 24"><path d="M12 3.5v8"/><path d="M7.1 6.6a7 7 0 1 0 9.8 0"/></svg>
  <div><b>Remote start</b><small id="startHint">Press and hold</small></div>
</button>

<section class="walk">
  <div class="head"><b>Walk-up</b><span>Unlock zone −65 dBm</span></div>
  <div class="seg" role="radiogroup" aria-label="Walk-up mode">
    <button type="button" role="radio" id="mOff" data-cmd="Off">Off</button>
    <button type="button" role="radio" id="mAuto" data-cmd="Auto">Auto unlock</button>
  </div>
  <button class="armrow" id="bArm" type="button" role="switch" aria-checked="false">
    <div>Start on next approach<small>Engine starts when you walk up, once</small></div><span class="sw"></span>
  </button>
</section>

<section class="act" id="act">
  <div class="head"><b>Activity</b><button type="button" id="more">Show all</button></div>
  <ul id="events"><li><time>—</time><span>No activity yet</span></li></ul>
</section>
</main>

<div class="sheet" id="sheet" hidden><div>
  <b>Connect to your truck</b>
  <p id="sheetMsg">Chrome needs permission to talk to the board.</p>
  <button type="button" id="sheetBtn">Choose Ram Remote</button>
</div></div>
<div class="note" id="note" role="status" aria-live="polite"></div>

<script>
'use strict';
const NAME = 'Ram Remote';
const SVC = '8f1c0001-6a52-4d2e-9a4b-52414d313530';
const CMD = '8f1c0002-6a52-4d2e-9a4b-52414d313530';
const STAT = '8f1c0003-6a52-4d2e-9a4b-52414d313530';
const $ = id => document.getElementById(id), enc = new TextEncoder(), dec = new TextDecoder();
let dev = null, cmdCh = null, statCh = null, connected = false, busy = false, pollT = null, retryT = null, cur = null;

/* Web Bluetooth runs one GATT operation at a time: every operation goes through this queue. */
let chain = Promise.resolve();
function op(fn) { const p = chain.then(fn, fn); chain = p.catch(() => {}); return p; }

let noteT = null;
function note(t, bad) {
  const n = $('note'); n.textContent = t; n.className = 'note show' + (bad ? ' bad' : '');
  clearTimeout(noteT); noteT = setTimeout(() => { n.className = 'note' + (bad ? ' bad' : ''); }, 2400);
}
function conn(text, cls) { $('connT').textContent = text; $('conn').className = 'conn ' + (cls || ''); }
function enable(on) { document.querySelectorAll('[data-cmd],#bStart,#bArm').forEach(b => { b.disabled = !on; }); }
function sheet(msg) { $('sheetMsg').innerHTML = msg; $('sheet').hidden = false; }
function timeout(p, ms, w) { return Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error(w + ' timed out')), ms))]); }

/* Board ages look like " 4m07s" or " 2h15m"; shown as "4 min", "2 h", "21 s". */
function ago(a) {
  const h = /(\d+)h/.exec(a), m = /(\d+)m(?!s)/.exec(a) || /(\d+)m\d/.exec(a), s = /(\d+)s/.exec(a);
  if (h) return h[1] + ' h';
  if (m && +m[1] > 0) return m[1] + ' min';
  return (s ? +s[1] : 0) + ' s';
}
function show(s) {
  cur = s;
  const d = s.link ? (s.avg || 0) : 0, last = (s.last || '').toLowerCase();
  /* Lock state comes from the last command: the truck sends no feedback. */
  $('stateT').textContent = s.engine ? 'Engine running' : last === 'lock' ? 'Locked' : last === 'unlock' ? 'Unlocked' : 'Ready';
  $('stateS').textContent = 'Walk-up ' + (s.auto ? 'auto unlock' : 'off') + (s.armed ? ' · start armed' : '');
  const lvl = !d ? 0 : d >= -55 ? 5 : d >= -62 ? 4 : d >= -68 ? 3 : d >= -76 ? 2 : 1;
  $('bars').querySelectorAll('i').forEach((b, i) => b.classList.toggle('on', i < lvl));
  $('dbm').textContent = d ? d + ' dBm' : '—';
  $('zone').textContent = !s.link ? 'Away' : d >= -65 ? 'At truck' : d >= -76 ? 'Close' : 'Far';
  $('eng').textContent = s.engine ? 'Running' : 'Off';
  $('eng').className = 'v' + (s.engine ? ' run' : '');
  $('bLock').classList.toggle('cur', last === 'lock');
  $('bUnlock').classList.toggle('cur', last === 'unlock');
  $('bStart').classList.toggle('running', !!s.engine);
  $('mAuto').classList.toggle('sel', !!s.auto); $('mAuto').setAttribute('aria-checked', !!s.auto);
  $('mOff').classList.toggle('sel', !s.auto); $('mOff').setAttribute('aria-checked', !s.auto);
  $('bArm').setAttribute('aria-checked', !!s.armed);
  const ul = $('events'); ul.textContent = '';
  (s.ev || []).forEach(e => {
    const li = document.createElement('li'), t = document.createElement('time'), x = document.createElement('span');
    t.textContent = ago(e[0]); x.textContent = e[1].charAt(0).toUpperCase() + e[1].slice(1);
    li.append(t, x); ul.append(li);
  });
  if (!ul.children.length) ul.innerHTML = '<li><time>—</time><span>No activity yet</span></li>';
}

async function exchange(n) {
  await cmdCh.writeValueWithResponse(enc.encode(n));
  return JSON.parse(dec.decode(await statCh.readValue()));
}
function poll() {
  stopPoll();
  pollT = setInterval(() => { if (connected && !busy && !document.hidden) op(() => exchange('Status')).then(show).catch(() => {}); }, 2000);
}
function stopPoll() { if (pollT) clearInterval(pollT); pollT = null; }

/* Chrome opens GATT only to a device it has heard in this page session. */
async function hear(d, ms) {
  if (!d.watchAdvertisements) return;
  const ac = new AbortController();
  const h = new Promise(r => d.addEventListener('advertisementreceived', r, { once: true }));
  await d.watchAdvertisements({ signal: ac.signal });
  try { await timeout(h, ms, 'Listening'); } finally { ac.abort(); }
}

async function connect() {
  clearTimeout(retryT);
  if (connected || busy) return;
  if (!navigator.bluetooth) { conn('No Bluetooth', 'err'); sheet('This browser has no Web Bluetooth. Open this page in <em>Chrome</em>.'); return; }
  if (!navigator.bluetooth.getDevices) { conn('Setup', 'wait'); sheet('Turn on <em>chrome://flags/#enable-web-bluetooth-new-permissions-backend</em>, relaunch Chrome, then reload.'); return; }
  busy = true; enable(false);
  try {
    dev = (await navigator.bluetooth.getDevices()).find(d => d.name === NAME);
    if (!dev) { conn('Setup', 'wait'); sheet('Tap the button, then choose <em>Ram Remote</em> in the list.'); return; }
    conn('Searching', 'wait');
    await hear(dev, 12000);
    conn('Connecting', 'wait');
    const server = await timeout(dev.gatt.connect(), 15000, 'Connect');
    let svc;
    try { svc = await server.getPrimaryService(SVC); }
    catch (e) {
      if (e.name === 'SecurityError') { conn('Setup', 'wait'); sheet('Chrome needs permission for the truck controls. Tap the button and choose <em>Ram Remote</em>.'); return; }
      if (e.name === 'NotFoundError') { conn('Update', 'err'); sheet('The phone still has an old copy of the board\'s services. Turn the phone\'s <em>Bluetooth off and on</em>, wait 10 seconds, then reload.'); return; }
      throw e;
    }
    cmdCh = await svc.getCharacteristic(CMD);
    statCh = await svc.getCharacteristic(STAT);
    dev.addEventListener('gattserverdisconnected', drop, { once: true });
    connected = true; $('sheet').hidden = true; conn('Connected', 'ok'); enable(true);
    show(await op(() => exchange('Status')));
    poll();
  } catch (e) {
    conn('Not found', 'err');
    note(e.message.includes('Listening') ? 'Truck not in range' : 'Bluetooth: ' + e.message, true);
    retry();
  } finally { busy = false; }
}
function drop() { connected = false; stopPoll(); enable(false); conn('Reconnecting', 'wait'); retry(1500); }
function retry(ms) { clearTimeout(retryT); if (!document.hidden) retryT = setTimeout(connect, ms || 5000); }

const DONE = { Lock: 'Lock sent', Unlock: 'Unlock sent', Start: 'Remote start sent', Auto: 'Walk-up unlock on', Off: 'Walk-up off', Arm: 'Start on approach armed', Disarm: 'Start on approach off' };
async function go(n) {
  if (!connected) { note('Not connected', true); return; }
  try {
    show(await op(() => exchange(n)));
    note(DONE[n] || n);
    if (navigator.vibrate) navigator.vibrate(30);
  } catch (e) { note(n + ' failed. Try again.', true); }
}

document.querySelectorAll('[data-cmd]').forEach(b => b.addEventListener('click', () => go(b.dataset.cmd)));
$('bArm').addEventListener('click', () => go(cur && cur.armed ? 'Disarm' : 'Arm'));

/* Remote start: press and hold 1.2 s, so a stray tap never starts the engine. */
let holdT = null;
const st = $('bStart');
function holdStart(e) {
  if (st.disabled) return;
  e.preventDefault();
  st.classList.add('hold'); $('startHint').textContent = 'Keep holding';
  holdT = setTimeout(() => { holdT = null; holdEnd(); go('Start'); }, 1200);
}
function holdEnd() {
  if (holdT) { clearTimeout(holdT); holdT = null; note('Hold to start'); }
  st.classList.remove('hold'); $('startHint').textContent = 'Press and hold';
}
st.addEventListener('pointerdown', holdStart);
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => st.addEventListener(t, () => { if (st.classList.contains('hold')) holdEnd(); }));
st.addEventListener('contextmenu', e => e.preventDefault());

$('more').addEventListener('click', () => { const a = $('act'); a.classList.toggle('open'); $('more').textContent = a.classList.contains('open') ? 'Show less' : 'Show all'; });
$('sheetBtn').addEventListener('click', async () => {
  try {
    await navigator.bluetooth.requestDevice({ filters: [{ name: NAME }], optionalServices: [SVC] });
    $('sheet').hidden = true; connect();
  } catch (e) { if (e.name !== 'NotFoundError') note(e.message, true); }
});
$('conn').addEventListener('click', () => { if (!connected) connect(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopPoll(); clearTimeout(retryT); }
  else if (connected) poll(); else connect();
});
enable(false);
connect();
</script>
</body></html>
